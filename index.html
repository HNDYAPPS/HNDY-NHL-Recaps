<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Recaps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #eee;
    font-family: 'Oswald', system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  #videowrap {
    flex: 1;
    position: relative;
    background: #000;
  }
  video-js {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  /* No native control bar at all: no progress, no duration, no spoilers */
  .vjs-control-bar,
  .vjs-big-play-button,
  .vjs-progress-control,
  .vjs-duration,
  .vjs-remaining-time,
  .vjs-current-time,
  .vjs-time-divider {
    display: none !important;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 20px;
    background: #111;
    border-top: 1px solid #222;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #bar.not-started {
    pointer-events: none;
    opacity: 0.35;
  }
  #bar.auto-hidden {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  #info {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #infoText {
    min-width: 0;
  }
  #brand {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: center;
    color: #fff;
    background: #1f3a5f;
    padding: 6px 12px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  #line1 {
    font-size: 30px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #teams {
    color: #ddd;
    margin-left: 16px;
  }
  #line2 {
    font-size: 15px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }
  #new-badge {
    background: #2a5;
    color: #000;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .divider {
    width: 2px;
    align-self: stretch;
    background: #2a2a2a;
  }
  select, button {
    height: 58px;
    box-sizing: border-box;
    font-family: 'Oswald', system-ui, sans-serif;
    font-weight: 600;
    background: #1c1c1c;
    color: #eee;
    border: 2px solid #3a3a3a;
    border-radius: 10px;
    cursor: pointer;
  }
  select {
    font-size: 18px;
    padding: 0 12px;
    max-width: 220px;
  }
  button {
    font-size: 24px;
    min-width: 66px;
    padding: 0 18px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  button:hover, button:focus { background: #333; border-color: #888; outline: none; }
  button.active { background: #2a5; border-color: #2a5; color: #000; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: rgba(0,0,0,0.85);
    z-index: 10;
  }
  #overlay button {
    font-size: 26px;
    height: auto;
    padding: 26px 40px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #toast {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 5;
  }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }

  @media (max-width: 640px) {
    #bar { gap: 8px; padding: 8px 10px; }
    #brand { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
    #line1 { font-size: 18px; }
    #line2 { font-size: 11px; }
    #new-badge { font-size: 10px; padding: 1px 6px; }
    select, button { height: 42px; }
    select { font-size: 13px; padding: 0 8px; max-width: 110px; }
    button { font-size: 14px; min-width: 40px; padding: 0 8px; }
    .group { gap: 6px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="videowrap">
    <video-js
      id="player"
      class="vjs-fill"
      data-account="6415718365001"
      data-player="EXtG1xJ7H"
      data-embed="default"
      playsinline>
    </video-js>
    <div id="toast"></div>
    <div id="overlay">
      <button id="startShort">▶ Short highlights</button>
      <button id="startLong">▶ Long highlights</button>
    </div>
  </div>
  <div id="bar" class="not-started">
    <div id="info">
      <div id="brand">HNDYAPPS<br>NHL RECAPS</div>
      <div id="infoText">
        <div id="line1">
          <span id="counter">Game –/–</span>
          <span id="teams"></span>
          <span id="new-badge" class="hidden"></span>
        </div>
        <div id="line2">
          <span id="date"></span>
          <span id="totalGames"></span>
        </div>
      </div>
    </div>
    <select id="jump" title="Jump to game"></select>
    <div class="divider"></div>
    <div class="group">
      <button id="prev" title="Previous (←)">⏮</button>
      <button id="back" title="-10 s (↓)">-10s</button>
      <button id="pause" title="Pause (space)">⏸</button>
      <button id="next" title="Next (→)">⏭</button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <button id="long" title="Short / long recap (L)">Long</button>
      <button id="fs" title="Fullscreen (F)">⛶</button>
    </div>
  </div>
</div>

<script src="https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.min.js"></script>
<script>
(function () {
  var STORE = 'nhlRecapQueue';
  var SEEN_STORE = 'nhlRecapSeen'; // per-device: how many games we'd seen last visit
  var END_MARGIN = 1.0; // seconds before end to switch
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  var games = [];
  var meta = { date: '', totalGames: 0 };
  var idx = 0;
  var useLong = false;
  var switching = false;
  var started = false;
  var player = null;

  var $ = function (id) { return document.getElementById(id); };

  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || '{}');
      useLong = !!s.useLong;
      // Only restore position if same queue (first gameId matches)
      if (s.firstGameId && games.length && s.firstGameId === games[0].gameId) {
        idx = Math.min(s.idx || 0, games.length - 1);
      }
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        firstGameId: games.length ? games[0].gameId : null,
        idx: idx,
        useLong: useLong
      }));
    } catch (e) {}
  }

  // Auto-hide the control bar on mobile only (small screen + touch),
  // not on desktop or TV/Chromecast (those keep the bar always visible).
  var HIDE_DELAY = 2000;
  var hideTimer = null;

  function isMobile() {
    try {
      return window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 900;
    } catch (e) { return false; }
  }

  function scheduleHide() {
    if (!isMobile()) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (started && player && !player.paused()) {
        $('bar').classList.add('auto-hidden');
      }
    }, HIDE_DELAY);
  }

  function showBar() {
    $('bar').classList.remove('auto-hidden');
    scheduleHide();
  }

  function checkNewGames() {
    // Per-device only: compares against what THIS browser last saw for
    // this date. Doesn't know what you watched on another device.
    try {
      var seen = JSON.parse(localStorage.getItem(SEEN_STORE) || '{}');
      var prevCount = (seen.date === meta.date) ? (seen.gameCount || 0) : 0;
      var diff = games.length - prevCount;
      if (diff > 0 && prevCount > 0) {
        var badge = $('new-badge');
        badge.textContent = '+' + diff + ' new';
        badge.classList.remove('hidden');
      }
      localStorage.setItem(SEEN_STORE, JSON.stringify({ date: meta.date, gameCount: games.length }));
    } catch (e) {}
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  function formatDate(dateStr) {
    // dateStr is "YYYY-MM-DD". Build as local date, not UTC, so the
    // weekday/day-of-month can't shift by a day in negative offsets.
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear();
  }

  function fillJumpMenu() {
    var sel = $('jump');
    sel.innerHTML = '';
    games.forEach(function (g, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = (i + 1) + '. ' + g.away + ' @ ' + g.home;
      sel.appendChild(opt);
    });
  }

  function render() {
    $('counter').textContent = 'Game ' + (idx + 1) + '/' + games.length;
    var g = games[idx];
    $('teams').textContent = g ? g.away + ' @ ' + g.home : '';
    $('date').textContent = meta.date ? formatDate(meta.date) : '';
    $('totalGames').textContent = meta.totalGames
      ? '· ' + meta.totalGames + ' games today'
      : '';
    $('long').classList.toggle('active', useLong);
    $('jump').value = idx;
  }

  function currentVideoId() {
    var g = games[idx];
    if (!g) return null;
    if (useLong && g.longVideoId) return g.longVideoId;
    return g.shortVideoId;
  }

  function loadCurrent() {
    var vid = currentVideoId();
    render();
    saveState();
    if (!vid) { toast('No video'); return; }
    switching = true;
    player.catalog.getVideo(vid, function (error, video) {
      if (error) {
        toast('Video load failed, skipping');
        switching = false;
        go(1);
        return;
      }
      player.catalog.load(video);
      player.play();
      setTimeout(function () { switching = false; }, 1500);
    });
  }

  function go(delta) {
    var n = idx + delta;
    if (n < 0) { toast('First game'); return; }
    if (n >= games.length) { toast('All done'); player.pause(); return; }
    idx = n;
    loadCurrent();
  }

  function jumpTo(n) {
    if (n < 0 || n >= games.length) return;
    idx = n;
    loadCurrent();
  }

  function togglePause() {
    if (player.paused()) { player.play(); $('pause').textContent = '⏸'; }
    else { player.pause(); $('pause').textContent = '▶'; }
  }

  function toggleLong() {
    useLong = !useLong;
    toast(useLong ? 'Long recap' : 'Short recap');
    loadCurrent();
  }

  function fullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }

  function beginPlayback(long) {
    if (started) return;
    started = true;
    useLong = long;
    $('overlay').classList.add('hidden');
    $('bar').classList.remove('not-started');
    loadCurrent();
  }

  function wire() {
    $('startShort').onclick = function () { beginPlayback(false); };
    $('startLong').onclick = function () { beginPlayback(true); };

    $('prev').onclick = function () { go(-1); };
    $('next').onclick = function () { go(1); };
    $('back').onclick = function () { player.currentTime(Math.max(0, player.currentTime() - 10)); };
    $('pause').onclick = togglePause;
    $('long').onclick = toggleLong;
    $('fs').onclick = fullscreen;
    $('jump').onchange = function () { jumpTo(Number($('jump').value)); };
    $('bar').addEventListener('pointerdown', showBar);
    $('videowrap').addEventListener('click', function () {
      if (isMobile() && started) showBar();
    });

    document.addEventListener('keydown', function (e) {
      if (!started) return;
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') e.target.blur();
      switch (e.key) {
        case ' ': e.preventDefault(); togglePause(); break;
        case 'ArrowRight': e.preventDefault(); go(1); break;
        case 'ArrowLeft': e.preventDefault(); go(-1); break;
        case 'ArrowDown': e.preventDefault(); $('back').onclick(); break;
        case 'l': case 'L': toggleLong(); break;
        case 'f': case 'F': fullscreen(); break;
      }
    });

    player.on('timeupdate', function () {
      if (switching || !started) return;
      var d = player.duration();
      if (d && d - player.currentTime() < END_MARGIN) go(1);
    });
    player.on('ended', function () { if (!switching && started) go(1); });
    player.on('play', function () { $('pause').textContent = '⏸'; scheduleHide(); });
    player.on('pause', function () {
      $('pause').textContent = '▶';
      clearTimeout(hideTimer);
      $('bar').classList.remove('auto-hidden');
    });
  }

  fetch('queue.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (q) {
      games = q.games || [];
      meta = { date: q.date || '', totalGames: q.totalGames || 0 };
      loadState();
      checkNewGames();
      fillJumpMenu();
      render();
      videojs.getPlayer('player').ready(function () {
        player = this;
        wire();
      });
    })
    .catch(function (e) {
      $('counter').textContent = 'queue.json load failed';
      console.error(e);
    });
})();
</script>
</body>
</html>
