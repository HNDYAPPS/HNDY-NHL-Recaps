name: Daily recap queue

on:
  schedule:
    # Every 10 min, 03:00-11:50 UTC, so recap videos that appear late
    # (West coast games especially) get picked up on a later run and
    # show up if you check the page again after your first watch.
    # Cron is UTC only: 03:00 UTC is 06:00 Finnish summer time but
    # 05:00 winter time, so the time-check step below skips anything
    # before 06:00 Helsinki time. First real run = 06:00 all year.
    - cron: "*/10 3-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-queue:
    runs-on: ubuntu-latest
    steps:
      # Scheduled runs before 06:00 Helsinki time (winter only) stop
      # here. Manual "Run workflow" always goes ahead.
      - name: Check Finnish time
        id: time
        run: |
          hour=$(TZ=Europe/Helsinki date +%H)
          echo "Helsinki time: $(TZ=Europe/Helsinki date +%H:%M)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" -lt 6 ]; then
            echo "Before 06:00 Finnish time, skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.time.outputs.go == 'true'

      - uses: actions/setup-python@v6
        if: steps.time.outputs.go == 'true'
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt
        if: steps.time.outputs.go == 'true'

      - run: python fetch.py
        if: steps.time.outputs.go == 'true'
      - run: python score.py
        if: steps.time.outputs.go == 'true'

      - name: Commit changed files if any
        if: steps.time.outputs.go == 'true'
        run: |
          git config user.name "nhl-kooste-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A picks up every profile's queue.json (and any regenerated
          # index.html copies) automatically, not just the root one --
          # .gitignore still keeps cache/ and debug/ out of this.
          git add -A
          git diff --cached --quiet || git commit -m "Update queue.json"
          git push
