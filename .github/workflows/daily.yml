name: Daily recap queue

on:
  schedule:
    # Every 10 min, 04:00-11:00 UTC. Covers roughly 06:00-13:00 Finnish
    # time (both DST and winter), so recap videos that appear late
    # (West coast games especially) get picked up on a later run and
    # show up if you check the page again after your first watch.
    - cron: "*/10 4-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch.py
      - run: python score.py

      - name: Commit changed files if any
        run: |
          git config user.name "nhl-kooste-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A picks up every profile's queue.json (and any regenerated
          # index.html copies) automatically, not just the root one --
          # .gitignore still keeps cache/ and debug/ out of this.
          git add -A
          git diff --cached --quiet || git commit -m "Update queue.json"
          git push
