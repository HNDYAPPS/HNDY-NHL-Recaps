<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Recaps</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #eee;
    font-family: 'Oswald', system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  #videowrap {
    flex: 1;
    position: relative;
    background: #000;
  }
  video-js {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    padding: 0 !important;
  }
  /* No native control bar at all: no progress, no duration, no spoilers */
  .vjs-control-bar,
  .vjs-big-play-button,
  .vjs-progress-control,
  .vjs-duration,
  .vjs-remaining-time,
  .vjs-current-time,
  .vjs-time-divider {
    display: none !important;
  }
  #bar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 20px;
    background: #111;
    border-top: 1px solid #222;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #bar.auto-hidden {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }
  #info {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #infoText {
    min-width: 0;
  }
  #brandLogo {
    height: 70px;
    width: auto;
    display: block;
    flex-shrink: 0;
  }
  #line1 {
    display: flex;
    align-items: center;
    font-size: 30px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #teams {
    color: #ddd;
    margin-left: 16px;
  }
  #teams:not(:empty)::before {
    content: '\00b7';
    margin-right: 16px;
    color: #666;
  }
  #line2 {
    font-size: 15px;
    font-weight: 500;
    color: #888;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }
  #mobileLine { display: none; }
  #new-badge {
    background: #2a5;
    color: #000;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
  #controls {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .divider {
    width: 2px;
    align-self: stretch;
    background: #2a2a2a;
  }
  select, button {
    height: 58px;
    box-sizing: border-box;
    font-family: 'Oswald', system-ui, sans-serif;
    font-weight: 600;
    background: #1c1c1c;
    color: #eee;
    border: 2px solid #3a3a3a;
    border-radius: 10px;
    cursor: pointer;
  }
  select {
    font-size: 18px;
    padding: 0 12px;
    max-width: 220px;
  }
  button {
    font-size: 24px;
    min-width: 66px;
    padding: 0 18px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  button:hover, button:focus { background: #333; border-color: #888; outline: none; }
  button.active { background: #2a5; border-color: #2a5; color: #000; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: rgba(0,0,0,0.85);
    z-index: 10;
  }
  #overlayLogo {
    height: 110px;
    width: auto;
    margin-bottom: 10px;
  }
  #overlay button {
    font-size: 26px;
    height: auto;
    padding: 24px 0;
    width: min(85vw, 360px);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #toast {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 5;
  }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
  /* Liiga games play in YouTube's player, laid over the Brightcove one.
     visibility (not display:none) so the iframe keeps loading while
     hidden. The shield catches clicks so they never reach YouTube's
     own UI (title links, suggestions): click = pause/play instead. */
  #ytwrap { position: absolute; inset: 0; z-index: 2; background: #000; }
  #ytwrap.ythide { visibility: hidden; pointer-events: none; }
  #ytwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #ytShield { position: absolute; inset: 0; }
  /* Day arrows: plain clickable text either side of the date, same
     size as the date itself. Dimmed when no older/newer day exists. */
  .dayNav { cursor: pointer; padding: 0 6px; user-select: none; }
  .dayNav.off { opacity: 0.25; cursor: default; }

  @media (max-width: 640px), (max-height: 640px) {
    /* Matches on width OR height so a phone stays in compact mode in
       BOTH orientations (landscape width alone can exceed 640px). */
    /* Bar floats over the bottom of the video instead of taking its
       own row, so hiding it (auto-hide, below) gives the video the
       full screen instead of leaving an empty gap behind. */
    #bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      flex-wrap: wrap;
      row-gap: 10px;
      gap: 8px;
      padding: 10px;
      background: rgba(17, 17, 17, 0.92);
    }
    /* Brand logo is pure decoration; drop it on small screens so the
       game info and controls each get a full row to breathe. */
    #brandLogo { display: none; }
    #info { flex: 1 1 100%; justify-content: center; }
    /* Desktop's two-line layout (big counter, small date line below)
       gives way to one centered line, same idea as the controls row. */
    #infoText { display: none; }
    #mobileLine {
      display: block;
      width: 100%;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Dividers are a nice-to-have on a roomy desktop bar, not worth
       the width on a phone. */
    .divider { display: none; }
    #controls {
      flex: 1 1 100%;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 4px;
    }
    select, button { height: 40px; }
    select { font-size: 12px; padding: 0 4px; max-width: 92px; }
    button { font-size: 13px; min-width: 34px; padding: 0 6px; }
    .group { gap: 4px; }
  }
  /* Chromecast: our own bar button (Google's <google-cast-launcher>
     element hid itself with display:none even with devices found).
     Hidden until the SDK reports a Chromecast on the network, so
     non-Chrome browsers never see it. Green (.active) while connected. */
  #castBtn svg { width: 26px; height: 26px; fill: currentColor; vertical-align: middle; }
  /* Shown over the video area while casting. Above ytwrap (2), below
     the start overlay (10) and toast (5). */
  #castScreen {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #000;
    color: #ccc;
    font-size: 28px;
    text-align: center;
    padding: 0 24px;
  }
  #castScreen svg { width: 96px; height: 96px; fill: #2a5; }
  @media (max-width: 640px), (max-height: 640px) {
    #castBtn svg { width: 18px; height: 18px; }
    #castScreen { font-size: 18px; }
    #castScreen svg { width: 56px; height: 56px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="videowrap">
    <video-js
      id="player"
      class="vjs-fill"
      data-account="6415718365001"
      data-player="EXtG1xJ7H"
      data-embed="default"
      playsinline>
    </video-js>
    <div id="ytwrap" class="ythide"><div id="yt"></div><div id="ytShield"></div></div>
    <div id="castScreen" class="hidden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>

        <button id="long" title="Short / long recap (L)">Long</button>
        <button id="fs" title="Fullscreen (F)">⛶</button>
        <button id="castBtn" class="hidden" title="Cast to TV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></button>
      </div>
    </div>

</div>

<script src="https://players.brightcove.net/6415718365001/EXtG1xJ7H_default/index.min.js"></script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script>
(function () {
  var STORE = 'nhlRecapQueue';
  var SEEN_STORE = 'nhlRecapSeen'; // per-device: how many games we'd seen last visit
  var END_MARGIN = 1.0; // seconds before end to switch
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  var games = [];
  var meta = { date: '', totalGames: 0 };
  var idx = 0;
  var useLong = false;
  var switching = false;
  var started = false;
  var player = null;

  var $ = function (id) { return document.getElementById(id); };

  function loadState() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE) || '{}');
      useLong = !!s.useLong;
      // Only restore position if same queue (first gameId matches)
      if (s.firstGameId && games.length && s.firstGameId === games[0].gameId) {
        idx = Math.min(s.idx || 0, games.length - 1);
      }
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        firstGameId: games.length ? games[0].gameId : null,
        idx: idx,
        useLong: useLong
      }));
    } catch (e) {}
  }

  // Auto-hide the control bar on mobile only (small screen + touch),
  // not on desktop or TV/Chromecast (those keep the bar always visible).
  var HIDE_DELAY = 2000;
  var hideTimer = null;

  function isMobile() {
    // Use the SHORTER of width/height: a phone's short side stays
    // small in both portrait and landscape, but raw width alone grows
    // past any reasonable phone threshold once rotated to landscape.
    try {
      var shortSide = Math.min(window.innerWidth, window.innerHeight);
      return window.matchMedia('(pointer: coarse)').matches && shortSide < 640;
    } catch (e) { return false; }
  }

  function scheduleHide() {
    if (!isMobile()) return;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (started && player && !M().paused()) {
        $('bar').classList.add('auto-hidden');
      }
    }, HIDE_DELAY);
  }

  function showBar() {
    $('bar').classList.remove('auto-hidden');
    scheduleHide();
  }

  var newGameIds = []; // gameIds not seen on this device before this load

  function checkNewGames() {
    // Per-device only: compares against what THIS browser last saw for
    // this date. Doesn't know what you watched on another device.
    // Tracks actual gameIds (not just a count) since re-ranking can
    // reorder the whole list between loads, not just append at the end.
    try {
      var seen = JSON.parse(localStorage.getItem(SEEN_STORE) || '{}');
      var prevIds = (seen.date === meta.date && seen.gameIds) ? seen.gameIds : null;
      if (prevIds) {
        newGameIds = games
          .map(function (g) { return g.gameId; })
          .filter(function (id) { return prevIds.indexOf(id) === -1; });
      }
      if (newGameIds.length) {
        var badge = $('new-badge');
        badge.textContent = '+' + newGameIds.length + ' new';
        badge.classList.remove('hidden');
      }
      localStorage.setItem(SEEN_STORE, JSON.stringify({
        date: meta.date,
        gameIds: games.map(function (g) { return g.gameId; })
      }));
    } catch (e) {}
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.classList.remove('show'); }, 1500);
  }

  function formatDate(dateStr) {
    // dateStr is "YYYY-MM-DD". Build as local date, not UTC, so the
    // weekday/day-of-month can't shift by a day in negative offsets.
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear();
  }

  function fillJumpMenu() {
    var sel = $('jump');
    sel.innerHTML = '';
    games.forEach(function (g, i) {
      var opt = document.createElement('option');
      opt.value = i;
      var isNew = newGameIds.indexOf(g.gameId) !== -1;
      // Prefix text too, not just color: native pickers on some mobile
      // browsers ignore inline <option> styling entirely.
      opt.textContent = (isNew ? '• ' : '') + (i + 1) + '. ' + teamsLabel(g);
      if (isNew) {
        opt.style.color = '#2a5';
        opt.style.fontWeight = 'bold';
      }
      sel.appendChild(opt);
    });
  }

  function teamsLabel(g) {
    // Liiga titles are "Home - Away"; NHL convention is "Away @ Home".
    return g.youtubeId ? 'Liiga: ' + g.home + ' – ' + g.away : g.away + ' @ ' + g.home;
  }

  function render() {
    var counterText = games.length
      ? 'Game ' + (idx + 1) + '/' + games.length
      : 'NO GAMES TODAY';
    $('counter').textContent = counterText;
    // Nothing to start on an empty day.
    $('startShort').classList.toggle('hidden', !games.length);
    $('startLong').classList.toggle('hidden', !games.length);
    var g = games[idx];
    $('teams').textContent = g ? teamsLabel(g) : '';
    $('date').textContent = meta.date ? formatDate(meta.date) : '';
    $('totalGames').textContent = meta.totalGames
      ? '· ' + meta.totalGames + ' games today'
      : '';
    $('long').classList.toggle('active', useLong);
    $('jump').value = idx;

    $('mDate').textContent = meta.date ? formatDate(meta.date) : '';
    var mobileParts = [counterText];
    if (g) mobileParts.push(teamsLabel(g));
    if (meta.totalGames) mobileParts.push(meta.totalGames + ' games today');
    $('mRest').textContent = ' · ' + mobileParts.join(' · ');
    updateDayNav();
  }

  // ---- Older dates: days/index.json lists every saved date ----
  var dates = [];
  var dayLoading = false; // ignore extra clicks while a day loads

  function updateDayNav() {
    var pos = dates.indexOf(meta.date);
    var show = pos !== -1;
    ['dayPrev', 'mDayPrev'].forEach(function (id) {
      $(id).classList.toggle('hidden', !show);
      $(id).classList.toggle('off', pos <= 0);
    });
    ['dayNext', 'mDayNext'].forEach(function (id) {
      $(id).classList.toggle('hidden', !show);
      $(id).classList.toggle('off', pos >= dates.length - 1);
    });
  }

  function applyQueue(q) {
    var liiga = (q.liiga || []).map(function (l) {
      return { gameId: 'yt-' + l.youtubeId, home: l.home, away: l.away, youtubeId: l.youtubeId };
    });
    games = (q.games || []).concat(liiga); // NHL always first
    meta = { date: q.date || '', totalGames: q.totalGames || 0 };
    idx = 0;
  }

  function changeDay(delta) {
    var pos = dates.indexOf(meta.date);
    var target = dates[pos + delta];
    if (pos === -1 || !target || dayLoading) return;
    dayLoading = true;
    fetch('days/' + target + '.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (q) {
        dayLoading = false;
        applyQueue(q);
        loadState();
        newGameIds = [];
        $('new-badge').classList.add('hidden');
        fillJumpMenu();
        render();
        if (!player) return;
        if (started && games.length) loadCurrent();
        else M().pause();
      })
      .catch(function () { dayLoading = false; toast('Day load failed'); });
  }

  ['dayPrev', 'mDayPrev'].forEach(function (id) {
    $(id).addEventListener('click', function () { changeDay(-1); });
  });
  ['dayNext', 'mDayNext'].forEach(function (id) {
    $(id).addEventListener('click', function () { changeDay(1); });
  });

  function fixPlayerSize() {
    // Brightcove's player sets its own inline sizing (a fixed aspect
    // ratio box, e.g. via padding-top) on both the player root element
    // and the video tag, which beats a plain CSS rule and causes black
    // letterbox bars or a tiny video after resize/rotation/loading a
    // new video. Re-force full size with !important, which is the one
    // thing that can override an inline style.
    if (!player) return;
    var force = function (el) {
      if (!el) return;
      el.style.setProperty('position', 'absolute', 'important');
      el.style.setProperty('top', '0', 'important');
      el.style.setProperty('left', '0', 'important');
      el.style.setProperty('right', '0', 'important');
      el.style.setProperty('bottom', '0', 'important');
      el.style.setProperty('width', '100%', 'important');
      el.style.setProperty('height', '100%', 'important');
      el.style.setProperty('padding', '0', 'important');
      el.style.setProperty('padding-top', '0', 'important');
      el.style.setProperty('padding-bottom', '0', 'important');
      el.style.setProperty('max-width', 'none', 'important');
      el.style.setProperty('max-height', 'none', 'important');
    };
    force(player.el());
    force(player.tech_ && player.tech_.el_);
  }

  // Always play the sharpest rendition. Brightcove's player otherwise
  // picks by player size (a 660 px window gets 360p) and by bandwidth.
  function forceMaxQuality() {
    if (!player || typeof player.qualityLevels !== 'function') return;
    try {
      var levels = player.qualityLevels();
      var max = 0;
      for (var i = 0; i < levels.length; i++) max = Math.max(max, levels[i].height || 0);
      if (!max) return;
      for (var j = 0; j < levels.length; j++) levels[j].enabled = (levels[j].height === max);
    } catch (e) {}
  }

  // ---- Two players: Brightcove (NHL) and YouTube (Liiga) ----
  // Controls talk to M(), which is whichever one is showing now.
  var mode = 'bc';
  var ytPlayer = null;
  var ytReady = false;
  var ytPending = null; // Liiga video asked for before YouTube was ready

  var bcM = {
    play: function () { player.play(); },
    pause: function () { if (player) player.pause(); },
    paused: function () { return !player || player.paused(); },
    time: function (t) { return t === undefined ? player.currentTime() : player.currentTime(t); },
    duration: function () { return player.duration(); }
  };
  var ytM = {
    play: function () { if (ytReady) ytPlayer.playVideo(); },
    pause: function () { if (ytReady) ytPlayer.pauseVideo(); },
    paused: function () {
      if (!ytReady) return true;
      var st = ytPlayer.getPlayerState();
      return st !== 1 && st !== 3; // 1 playing, 3 buffering
    },
    time: function (t) {
      if (!ytReady) return 0;
      if (t === undefined) return ytPlayer.getCurrentTime();
      ytPlayer.seekTo(t, true);
    },
    duration: function () { return ytReady ? ytPlayer.getDuration() : 0; }
  };
  // ---- Chromecast (Google Cast web sender; Chrome only) ----
  // Third mode 'cast': the TV plays, this page is only the remote.
  var castCtx = null;      // cast.framework.CastContext
  var remotePlayer = null; // cast.framework.RemotePlayer (mirror of TV state)
  var remoteCtl = null;    // cast.framework.RemotePlayerController
  var castResumeAt = 0;    // TV position to resume locally after disconnect
  var lastCastTime = 0;    // last time the TV reported (RemotePlayer is reset before SESSION_ENDED reaches us)
  var castSeq = 0;         // ignore results of a superseded castLoad (fast next/prev)

  var castM = {
    play: function () { if (remotePlayer && remotePlayer.isMediaLoaded && remotePlayer.isPaused) remoteCtl.playOrPause(); },
    pause: function () { if (remotePlayer && remotePlayer.isMediaLoaded && !remotePlayer.isPaused) remoteCtl.playOrPause(); },
    paused: function () { return !remotePlayer || !remotePlayer.isMediaLoaded || remotePlayer.isPaused; },
    time: function (t) {
      if (!remotePlayer || !remotePlayer.isMediaLoaded) return 0;
      if (t === undefined) return remotePlayer.currentTime;
      remotePlayer.currentTime = t;
      remoteCtl.seek();
    },
    duration: function () { return (remotePlayer && remotePlayer.isMediaLoaded) ? remotePlayer.duration : 0; }
  };
  function M() { return mode === 'cast' ? castM : mode === 'yt' ? ytM : bcM; }

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('yt', {
      width: '100%',
      height: '100%',
      playerVars: {
        controls: 0, disablekb: 1, fs: 0, rel: 0, iv_load_policy: 3,
        modestbranding: 1, playsinline: 1, cc_load_policy: 0
      },
      events: {
        onReady: function () {
          ytReady = true;
          if (ytPending) { var id = ytPending; ytPending = null; ytPlayer.loadVideoById(id); }
        },
        onStateChange: function (e) {
          if (mode !== 'yt') return;
          if (e.data === 1) {
            $('pause').textContent = '⏸';
            scheduleHide();
            // Channel can force subtitles on despite cc_load_policy;
            // unloading the captions module turns them off for real.
            try { ytPlayer.unloadModule('captions'); ytPlayer.unloadModule('cc'); } catch (err) {}
          }
          else if (e.data === 2) {
            $('pause').textContent = '▶';
            clearTimeout(hideTimer);
            $('bar').classList.remove('auto-hidden');
          } else if (e.data === 0 && started && !switching) go(1);
        }
      }
    });
  };
  (function () {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();

  // Switch ~1 s before the end so YouTube's end screen (suggested
  // videos, possibly with scores) never shows.
  setInterval(function () {
    if (mode !== 'yt' || !ytReady || switching || !started) return;
    var d = ytM.duration();
    if (d && !ytM.paused() && d - ytM.time() < END_MARGIN) go(1);
  }, 250);

  function loadYouTube(id) {
    castResumeAt = 0; // position belonged to an NHL video, not this one
    if (player) player.pause();
    mode = 'yt';
    $('ytwrap').classList.remove('ythide');
    switching = true;
    setTimeout(function () { switching = false; }, 1500);
    if (ytReady) ytPlayer.loadVideoById(id);
    else { ytPending = id; toast('Loading YouTube…'); }
  }

  function showBrightcove() {
    if (mode === 'yt' && ytReady) ytPlayer.stopVideo();
    mode = 'bc';
    ytPending = null;
    $('ytwrap').classList.add('ythide');
  }

  // Called by cast_sender.js once it knows whether Cast works here.
  // Non-Chrome browsers: ok === false (or never called) → nothing happens.
  window.__onGCastApiAvailable = function (ok) {
    if (!ok || !window.cast || !cast.framework) return;
    castCtx = cast.framework.CastContext.getInstance();
    castCtx.setOptions({
      receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
    remotePlayer = new cast.framework.RemotePlayer();
    remoteCtl = new cast.framework.RemotePlayerController(remotePlayer);
    // Show the button only when there is a Chromecast on the network.
    var showBtn = function (st) {
      $('castBtn').classList.toggle('hidden', st === cast.framework.CastState.NO_DEVICES_AVAILABLE);
    };
    showBtn(castCtx.getCastState());
    castCtx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED, function (e) { showBtn(e.castState); });
    // Opens Chrome's device picker (or "Stop casting" while connected).
    $('castBtn').onclick = function () {
      castCtx.requestSession().catch(function (err) {
        if (err !== 'cancel') console.error('cast requestSession', err);
      });
    };

    castCtx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, function (e) {
      var S = cast.framework.SessionState;
      if (e.sessionState === S.SESSION_STARTED || e.sessionState === S.SESSION_RESUMED) castConnected();
      else if (e.sessionState === S.SESSION_ENDED) castDisconnected();
    });

    var E = cast.framework.RemotePlayerEventType;
    remoteCtl.addEventListener(E.IS_PAUSED_CHANGED, function () {
      if (mode !== 'cast') return;
      $('pause').textContent = remotePlayer.isPaused ? '▶' : '⏸';
    });
    // Auto-next, same rule as the local players: switch just before the end.
    remoteCtl.addEventListener(E.CURRENT_TIME_CHANGED, function () {
      if (mode !== 'cast' || switching || !started || !remotePlayer.isMediaLoaded) return;
      var d = remotePlayer.duration, t = remotePlayer.currentTime;
      if (t) lastCastTime = t;
      if (d && t && d - t < END_MARGIN) go(1);
    });
    // Belt and braces: TV reports FINISHED (time events are only ~1/s).
    remoteCtl.addEventListener(E.PLAYER_STATE_CHANGED, function () {
      if (mode !== 'cast' || !started) return;
      if (remotePlayer.playerState !== chrome.cast.media.PlayerState.IDLE) return;
      var s = castCtx.getCurrentSession();
      var ms = s && s.getMediaSession();
      if (!ms) return;
      // TV accepted a source but could not play it (e.g. the inline
      // 1080p playlist): fall through to the next candidate.
      if (ms.idleReason === chrome.cast.media.IdleReason.ERROR && castCandidates.length) {
        switching = true;
        castTryNext();
        return;
      }
      if (switching) return;
      if (ms.idleReason === chrome.cast.media.IdleReason.FINISHED) go(1);
    });
  };

  function castConnected() {
    var s = castCtx.getCurrentSession();
    var name = (s && s.getCastDevice() && s.getCastDevice().friendlyName) || 'TV';
    if (mode === 'bc' && player) player.pause();
    if (mode === 'yt' && ytReady) ytPlayer.stopVideo();
    ytPending = null;
    $('ytwrap').classList.add('ythide');
    mode = 'cast';
    $('castName').textContent = 'Casting to ' + name;
    $('castScreen').classList.remove('hidden');
    $('castBtn').classList.add('active');
    ensureStarted(); // no argument: keep the saved short/long setting
    // Rejoined after a page reload while the TV is already playing:
    // leave it alone, just show the state. Otherwise start current game.
    var hasMedia = remotePlayer.isMediaLoaded || !!(s && s.getMediaSession());
    if (hasMedia) { render(); return; }
    if (games.length) loadCurrent();
  }

  function castDisconnected() {
    if (mode !== 'cast') return;
    castResumeAt = lastCastTime;
    lastCastTime = 0;
    $('castScreen').classList.add('hidden');
    $('castBtn').classList.remove('active');
    $('pause').textContent = '⏸';
    mode = 'bc';
    if (started && games.length) loadCurrent();
  }

  // Pick the https HLS master and the https MP4 from the Brightcove
  // catalog entry. Either may be null.
  function castSources(video) {
    var list = (video && video.sources) || [];
    var pick = function (test) {
      for (var i = 0; i < list.length; i++) {
        var s = list[i];
        if (s.src && s.src.indexOf('https://') === 0 && test(s)) return s;
      }
      return null;
    };
    var hls = pick(function (s) { return /mpegurl/i.test(s.type || ''); });
    var mp4 = pick(function (s) { return s.container === 'MP4' || /mp4/i.test(s.type || ''); });
    return {
      hls: hls ? { src: hls.src, type: 'application/x-mpegURL' } : null,
      mp4: mp4 ? { src: mp4.src, type: mp4.type || 'video/mp4' } : null
    };
  }

  // The TV picks its own quality and tends to sit low. Build a copy of
  // the master playlist that only lists the sharpest rendition and hand
  // it over inline (data: URL), so the TV has nothing lower to choose.
  // Resolves to the data: URL, or null when anything goes wrong.
  function maxQualityManifest(masterUrl) {
    return fetch(masterUrl).then(function (r) { return r.text(); }).then(function (txt) {
      var lines = txt.split(/\r?\n/);
      var abs = function (u) { try { return new URL(u, masterUrl).href; } catch (e) { return u; } };
      var maxH = 0;
      lines.forEach(function (l) {
        var m = /^#EXT-X-STREAM-INF:.*RESOLUTION=\d+x(\d+)/.exec(l);
        if (m) maxH = Math.max(maxH, Number(m[1]));
      });
      if (!maxH) return null;
      var out = [];
      for (var i = 0; i < lines.length; i++) {
        var l = lines[i];
        if (/^#EXT-X-STREAM-INF/.test(l)) {
          var m2 = /RESOLUTION=\d+x(\d+)/.exec(l);
          var uri = lines[i + 1] || '';
          i++;
          if (m2 && Number(m2[1]) === maxH) { out.push(l); out.push(abs(uri)); }
        } else if (/^#EXT-X-I-FRAME-STREAM-INF/.test(l)) {
          continue; // trick-play thumbnails, not needed
        } else if (/^#EXT-X-MEDIA/.test(l)) {
          out.push(l.replace(/URI="([^"]+)"/, function (_, u) { return 'URI="' + abs(u) + '"'; }));
        } else if (l.trim()) {
          out.push(l);
        }
      }
      return 'data:application/x-mpegURL;base64,' + btoa(unescape(encodeURIComponent(out.join('\n') + '\n')));
    }).catch(function () { return null; });
  }

  // Candidates for the current game, tried in order until one plays:
  // 1080p-only playlist → plain MP4 (720p, always works) → plain HLS.
  var castCandidates = [];
  var castCur = null; // { session, seq } of the load in progress

  function castTryNext() {
    var c = castCur;
    if (!c || mode !== 'cast' || c.seq !== castSeq) return;
    var cand = castCandidates.shift();
    if (!cand) { switching = false; toast('Cast load failed, skipping'); go(1); return; }
    var g = games[idx];
    var info = new chrome.cast.media.MediaInfo(cand.src, cand.type);
    info.streamType = chrome.cast.media.StreamType.BUFFERED;
    info.metadata = new chrome.cast.media.GenericMediaMetadata();
    info.metadata.title = teamsLabel(g) + ' · Game ' + (idx + 1) + '/' + games.length;
    var req = new chrome.cast.media.LoadRequest(info);
    req.autoplay = true;
    c.session.loadMedia(req).then(
      function () {
        if (c.seq !== castSeq) return;
        lastCastTime = 0;
        $('pause').textContent = remotePlayer.isPaused ? '▶' : '⏸';
        // Hold the guard a moment: RemotePlayer may still report the
        // previous video's time/duration right after the load resolves.
        setTimeout(function () { if (c.seq === castSeq) switching = false; }, 1500);
      },
      function (err) {
        if (c.seq !== castSeq) return; // cancelled by a newer load: not an error
        console.warn('cast loadMedia rejected, trying next source', err);
        castTryNext();
      }
    );
  }

  function castLoad(g) {
    if (!g || !player) return; // player null = Brightcove not ready yet; wire() retries
    var session = castCtx && castCtx.getCurrentSession();
    if (!session) return;
    if (g.youtubeId) {
      // Stop whatever the TV is playing so the old game does not run on.
      try { if (remotePlayer.isMediaLoaded) remoteCtl.stop(); } catch (e) {}
      toast('Liiga not castable');
      return;
    }
    var vid = currentVideoId();
    if (!vid) { toast('No video'); return; }
    var seq = ++castSeq;
    switching = true;
    player.catalog.getVideo(vid, function (error, video) {
      if (mode !== 'cast' || seq !== castSeq) return; // cast ended, or a newer load superseded this one
      if (error) { toast('Video load failed, skipping'); switching = false; go(1); return; }
      var srcs = castSources(video);
      if (!srcs.hls && !srcs.mp4) { toast('No castable stream, skipping'); switching = false; go(1); return; }
      var ready = srcs.hls ? maxQualityManifest(srcs.hls.src) : Promise.resolve(null);
      ready.then(function (dataUrl) {
        if (mode !== 'cast' || seq !== castSeq) return;
        castCandidates = [];
        if (dataUrl) castCandidates.push({ src: dataUrl, type: 'application/x-mpegURL' });
        if (srcs.mp4) castCandidates.push(srcs.mp4);
        if (srcs.hls) castCandidates.push(srcs.hls);
        castCur = { session: session, seq: seq };
        castTryNext();
      });
    });
  }

  function currentVideoId() {
    var g = games[idx];
    if (!g) return null;
    if (useLong && g.longVideoId) return g.longVideoId;
    return g.shortVideoId;
  }

  function loadCurrent() {
    var g = games[idx];
    render();
    saveState();
    if (mode === 'cast') { castLoad(g); return; }
    if (g && g.youtubeId) { loadYouTube(g.youtubeId); return; }
    showBrightcove();
    var vid = currentVideoId();
    if (!vid) { toast('No video'); return; }
    switching = true;
    player.catalog.getVideo(vid, function (error, video) {
      // Moved on to a Liiga game while this was loading: don't play.
      if (mode !== 'bc') return;
      if (error) {
        toast('Video load failed, skipping');
        switching = false;
        go(1);
        return;
      }
      // Coming back from a cast: pick up where the TV was.
      if (castResumeAt) {
        var at = castResumeAt;
        castResumeAt = 0;
        player.one('loadedmetadata', function () { try { player.currentTime(at); } catch (e) {} });
      }
      player.catalog.load(video);
      player.play();
      // Brightcove can re-apply its own sizing more than once while a
      // new video spins up, so re-force ours a few times to win the race.
      [0, 150, 400, 900, 1500].forEach(function (ms) { setTimeout(fixPlayerSize, ms); });
      setTimeout(function () { switching = false; }, 1500);
    });
  }

  function ensureStarted(defaultLong) {
    // Bar is fully usable from page load now (dropdown, prev/next,
    // etc.) — whichever control is used first implicitly "starts"
    // playback instead of requiring the overlay buttons specifically.
    if (started) return;
    started = true;
    if (typeof defaultLong === 'boolean') useLong = defaultLong;
    $('overlay').classList.add('hidden');
  }

  function go(delta) {
    ensureStarted(false);
    var n = idx + delta;
    if (n < 0) { toast('First game'); return; }
    if (n >= games.length) { toast('All done'); M().pause(); return; }
    if (mode === 'cast' && games[n].youtubeId) { toast('Liiga not castable — end of queue'); return; }
    idx = n;
    loadCurrent();
  }

  function jumpTo(n) {
    ensureStarted(false);
    if (n < 0 || n >= games.length) return;
    if (mode === 'cast' && games[n].youtubeId) { toast('Liiga not castable'); render(); return; }
    idx = n;
    loadCurrent();
  }

  function togglePause() {
    if (!started) { ensureStarted(false); loadCurrent(); return; }
    if (M().paused()) { M().play(); $('pause').textContent = '⏸'; }
    else { M().pause(); $('pause').textContent = '▶'; }
  }

  function toggleLong() {
    if (!started) { ensureStarted(true); loadCurrent(); return; }
    useLong = !useLong;
    toast(useLong ? 'Long recap' : 'Short recap');
    // Liiga has one video per game: keep playing, setting applies to NHL.
    if (mode === 'yt') { render(); saveState(); return; }
    loadCurrent();
  }

  function fullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }

  function wire() {
    $('startShort').onclick = function () { ensureStarted(false); loadCurrent(); };
    $('startLong').onclick = function () { ensureStarted(true); loadCurrent(); };

    $('prev').onclick = function () { go(-1); };
    $('next').onclick = function () { go(1); };
    $('back').onclick = function () {
      if (!started) { ensureStarted(false); loadCurrent(); return; }
      M().time(Math.max(0, M().time() - 5));
    };
    $('fwd').onclick = function () {
      if (!started) { ensureStarted(false); loadCurrent(); return; }
      M().time(Math.min(M().duration() || Infinity, M().time() + 5));
    };
    $('pause').onclick = togglePause;
    $('long').onclick = toggleLong;
    $('fs').onclick = fullscreen;
    $('jump').onchange = function () { jumpTo(Number($('jump').value)); };
    window.addEventListener('resize', fixPlayerSize);
    window.addEventListener('orientationchange', function () {
      setTimeout(fixPlayerSize, 300);
      // isMobile() can flip true/false on rotation; re-evaluate whether
      // the bar should be hiding itself under the new orientation.
      showBar();
    });

    $('bar').addEventListener('pointerdown', showBar);
    // pointerdown (not click) so it can't be swallowed by video.js's own
    // touch/tap handling on the video element before a click ever fires.
    $('videowrap').addEventListener('pointerdown', function () {
      if (isMobile() && started) showBar();
    });
    // Disable video.js's own built-in click-to-toggle so our handler
    // below is the only thing driving it (avoids a double-toggle where
    // a single click both plays AND immediately pauses again).
    try { player.userActions({ click: false }); } catch (e) {}
    $('videowrap').addEventListener('click', function () {
      togglePause();
    });

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') e.target.blur();
      switch (e.key) {
        case ' ': e.preventDefault(); togglePause(); break;
        case 'ArrowRight': e.preventDefault(); go(1); break;
        case 'ArrowLeft': e.preventDefault(); go(-1); break;
        case 'ArrowDown': e.preventDefault(); $('back').onclick(); break;
        case 'ArrowUp': e.preventDefault(); $('fwd').onclick(); break;
        case 'l': case 'L': toggleLong(); break;
        case 'f': case 'F': fullscreen(); break;
      }
    });

    player.on('timeupdate', function () {
      if (switching || !started || mode !== 'bc') return;
      var d = player.duration();
      if (d && d - player.currentTime() < END_MARGIN) go(1);
    });
    player.on('ended', function () { if (!switching && started && mode === 'bc') go(1); });
    player.on('loadedmetadata', fixPlayerSize);
    // Levels arrive while the manifest parses; re-apply once playing too
    // in case a level was added after loadedmetadata.
    player.on('loadedmetadata', forceMaxQuality);
    player.on('playing', forceMaxQuality);
    try { player.qualityLevels().on('addqualitylevel', forceMaxQuality); } catch (e) {}
    player.on('play', function () { $('pause').textContent = '⏸'; scheduleHide(); fixPlayerSize(); });
    player.on('pause', function () {
      if (mode !== 'bc') return;
      $('pause').textContent = '▶';
      clearTimeout(hideTimer);
      $('bar').classList.remove('auto-hidden');
    });
  }

  fetch('queue.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (q) {
      applyQueue(q);
      loadState();
      checkNewGames();
      fillJumpMenu();
      render();
      // Saved-days list is optional: missing file = no day arrows.
      fetch('days/index.json?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) { dates = d.dates || []; updateDayNav(); })
        .catch(function () {});
      videojs.getPlayer('player').ready(function () {
        player = this;
        wire();
        // Rejoined a cast session (page reload) before Brightcove was
        // ready and the TV is idle: start the current game now.
        if (mode === 'cast' && remotePlayer && !remotePlayer.isMediaLoaded && games.length) loadCurrent();
      });
    })
    .catch(function (e) {
      $('counter').textContent = 'queue.json load failed';
      console.error(e);
    });
})();
</script>
</body>
</html>
